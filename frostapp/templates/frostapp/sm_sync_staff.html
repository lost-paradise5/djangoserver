<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>SM Sync Staff → open_in_system / ukm_users</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    button { padding: 10px 14px; cursor:pointer; border-radius: 8px; border: 1px solid #ddd; background:#f7f7f7; }
    button.primary { background:#111; color:#fff; border-color:#111; }
    button.danger { background:#b00020; color:#fff; border-color:#b00020; }
    .meta { margin-top: 12px; padding: 12px; background:#fafafa; border: 1px solid #eee; border-radius: 10px; }
    .log { margin-top: 12px; height: 260px; overflow:auto; border: 1px solid #eee; border-radius: 10px; padding: 10px; background:#0b0f14; color:#cfe1ff; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #eee; padding: 8px; vertical-align: top; font-size: 13px; }
    th { background:#fafafa; position: sticky; top: 0; z-index: 1; }
    .badge { display:inline-block; padding:2px 8px; border-radius: 999px; border:1px solid #ddd; font-size: 12px; }
    .ok { background:#e8fff1; border-color:#b9f5d0; }
    .warn { background:#fff7e6; border-color:#ffe1a6; }
    .err { background:#ffe8ea; border-color:#ffb3bb; }
    .muted { color:#666; }
    details { margin-top: 6px; }
    summary { cursor: pointer; }
    .small { font-size: 12px; }
  </style>
</head>
<body>

<h2>Синхронизация пользователей: SMSTAFF → open_in_system / ukm_users</h2>

<div class="row">
  <button class="primary" id="btnTest">Тест (без изменений)</button>
  <button class="danger" id="btnReal">Настоящий (с записью в БД)</button>
  <button id="btnStop" disabled>Стоп</button>
  <span class="muted">Режим “Настоящий” пишет в Postgres.</span>
</div>

<div class="meta" id="metaBox">
  <div><b>Статус:</b> <span id="status">ожидание</span></div>
  <div class="row" style="margin-top:8px">
    <span class="badge" id="b_total">users: 0</span>
    <span class="badge ok" id="b_found">found users: 0</span>
    <span class="badge warn" id="b_nf">not found users: 0</span>
    <span class="badge ok" id="b_open">open_created: 0</span>
    <span class="badge ok" id="b_ukm">ukm_created: 0</span>
    <span class="badge err" id="b_err">errors: 0</span>
    <span class="badge" id="b_mode">mode: -</span>
  </div>
</div>

<div class="log" id="logBox"></div>

<table>
  <thead>
    <tr>
      <th style="width:80px">User ID</th>
      <th style="width:240px">ФИО</th>
      <th style="width:160px">employee_id (ИНН)</th>
      <th style="width:120px">Найдено?</th>
      <th style="width:170px">Базы</th>
      <th style="width:220px">Логины SMSTAFF</th>
      <th>Действия</th>
      <th style="width:320px">Примечания</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
  const streamUrl = "{{ stream_url }}";
  let es = null;

  const $ = (id) => document.getElementById(id);

  function logLine(obj) {
    const box = $("logBox");
    box.textContent += `[${new Date().toISOString()}] ${typeof obj === "string" ? obj : JSON.stringify(obj)}\n`;
    box.scrollTop = box.scrollHeight;
  }

  function setStatus(txt) { $("status").textContent = txt; }

  function setMeta(m) {
    $("b_total").textContent = `users: ${m.users_total ?? 0}`;
    $("b_found").textContent = `found users: ${m.found_total ?? 0}`;
    $("b_nf").textContent = `not found users: ${m.not_found_total ?? 0}`;
    $("b_open").textContent = `open_created: ${m.open_created ?? 0}`;
    $("b_ukm").textContent = `ukm_created: ${m.ukm_created ?? 0}`;
    $("b_err").textContent = `errors: ${m.errors ?? 0}`;
    $("b_mode").textContent = `mode: ${m.mode ?? "-"}`;
  }

  function upsertRow(res) {
    const id = `u_${res.user_id}`;
    let tr = document.getElementById(id);
    if (!tr) {
      tr = document.createElement("tr");
      tr.id = id;
      tr.innerHTML = `<td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>`;
      $("tbody").appendChild(tr);
    }

    tr.children[0].textContent = res.user_id;
    tr.children[1].textContent = res.fio || "";
    tr.children[2].textContent = res.inn_used || res.employee_id || "";

    const foundAny = !!res.found_any;
    tr.children[3].innerHTML = foundAny ? `<span class="badge ok">ДА</span>` : `<span class="badge warn">НЕТ</span>`;

    const foundServices = Array.isArray(res.found_services) ? res.found_services : [];
    const bases = [...new Set(foundServices.map(x => x.service).filter(Boolean))];
    const logins = [...new Set(foundServices.map(x => x.login).filter(Boolean))];

    tr.children[4].innerHTML = bases.length
      ? `<div><span class="badge ok">${bases.length}</span> баз</div><div class="muted small">${bases.slice(0,4).join(", ")}${bases.length>4 ? ", ..." : ""}</div>`
      : "";

    tr.children[5].innerHTML = logins.length
      ? `<div><span class="badge ok">${logins.length}</span> логин(ов)</div><div class="muted small">${logins.slice(0,3).join(", ")}${logins.length>3 ? ", ..." : ""}</div>`
      : "";

    // actions: подробности по каждой базе
    const actions = [];
    if (foundServices.length) {
      const lines = foundServices.map(it => {
        const oi = it.open_in_system || {};
        const uu = it.ukm_users || {};
        const store = it.ukm_storeid ? ` storeid=${it.ukm_storeid}` : "";
        const src = it.store_source ? ` (${it.store_source})` : "";
        return `[${it.service}] login=${it.login} sys=${it.system_id} | open: ${oi.message || ""} | ukm: ${uu.message || ""}${store}${src}`;
      });

      actions.push(`
        <details>
          <summary>Найдено в ${foundServices.length} базе(ах) — раскрыть</summary>
          <div class="small" style="margin-top:6px">
            ${lines.map(l => `<div>${l}</div>`).join("")}
          </div>
        </details>
      `);
    } else {
      actions.push(`<div class="muted">нет совпадений</div>`);
    }
    tr.children[6].innerHTML = actions.join("");

    // notes + search trace errors
    const notes = [];
    (res.notes || []).forEach(n => notes.push(`<div class="muted">${n}</div>`));

    const trace = Array.isArray(res.search_trace) ? res.search_trace : [];
    const errs = trace.filter(t => t.status === "error");
    if (errs.length) {
      notes.push(`<details><summary class="small">Ошибки по базам (${errs.length})</summary><div class="small" style="margin-top:6px">${errs.map(e => `<div>[${e.service}] ${e.error}</div>`).join("")}</div></details>`);
    }

    tr.children[7].innerHTML = notes.join("");
  }

  function start(mode) {
    stop();

    $("btnStop").disabled = false;
    $("btnTest").disabled = true;
    $("btnReal").disabled = true;
    setStatus(`запуск: ${mode}`);
    logLine(`START mode=${mode}`);

    es = new EventSource(`${streamUrl}?mode=${encodeURIComponent(mode)}`);

    es.addEventListener("hello", (e) => {
      const data = JSON.parse(e.data);
      logLine(data);
      setStatus(`работает: ${data.mode}`);
    });

    es.addEventListener("meta", (e) => {
      const m = JSON.parse(e.data);
      setMeta(m);
    });

    es.addEventListener("log", (e) => {
      logLine(JSON.parse(e.data));
    });

    es.addEventListener("user", (e) => {
      const res = JSON.parse(e.data);
      upsertRow(res);
    });

    es.addEventListener("done", (e) => {
      const m = JSON.parse(e.data);
      setMeta(m);
      logLine({DONE: m});
      setStatus(`готово за ${m.duration_sec || 0} сек`);
      stop();
    });

    es.onerror = () => {
      logLine("SSE error/connection closed");
    };
  }

  function stop() {
    if (es) {
      es.close();
      es = null;
    }
    $("btnStop").disabled = true;
    $("btnTest").disabled = false;
    $("btnReal").disabled = false;
  }

  $("btnTest").addEventListener("click", () => start("test"));
  $("btnReal").addEventListener("click", () => {
    const ok = confirm("Точно запускать НАСТОЯЩИЙ режим? Он будет писать в Postgres.");
    if (ok) start("real");
  });
  $("btnStop").addEventListener("click", () => {
    logLine("STOP pressed");
    stop();
    setStatus("остановлено");
  });
</script>

</body>
</html>
