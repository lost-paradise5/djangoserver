<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Контроль УД — вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --ui-bg1:#f4f6f9;
      --ui-bg2:#eef2f7;
      --ui-card:#ffffff;
      --ui-border:rgba(17,24,39,.10);
      --ui-shadow: 0 10px 28px rgba(16,24,40,.08);
      --ui-shadow-sm: 0 6px 16px rgba(16,24,40,.06);
    }
    body{
      background: radial-gradient(1200px 600px at 20% 0%, var(--ui-bg2), var(--ui-bg1));
      color:#111827;
    }
    .app-wrap{ min-height:100vh; display:flex; align-items:center; }
    .brand{
      display:flex; gap:.75rem; align-items:center;
      margin-bottom: 1.25rem;
    }
    .brand-badge{
      width:40px; height:40px; border-radius:12px;
      background: linear-gradient(135deg, #0d6efd, #0b5ed7);
      box-shadow: 0 10px 18px rgba(13,110,253,.22);
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:700;
    }
    .card{
      border:1px solid var(--ui-border);
      box-shadow: var(--ui-shadow);
      border-radius: 16px;
      overflow:hidden;
      background: var(--ui-card);
    }
    .card-header{
      background: linear-gradient(180deg, #0b1220 0%, #101827 100%);
      color:#fff;
      border-bottom:1px solid rgba(255,255,255,.08);
      padding: 1rem 1.25rem;
    }
    .card-body{ padding: 1.25rem; }
    .muted{ color: rgba(17,24,39,.65); }
    .form-control{
      border-radius: 12px;
      padding: .70rem .85rem;
      border:1px solid rgba(17,24,39,.14);
      box-shadow: none;
    }
    .form-control:focus{
      border-color: rgba(13,110,253,.55);
      box-shadow: 0 0 0 .25rem rgba(13,110,253,.12);
    }
    .btn{
      border-radius: 12px;
      padding: .70rem .9rem;
      font-weight: 600;
    }
    .hint{
      font-size: .92rem;
      background: #f8fafc;
      border: 1px dashed rgba(17,24,39,.18);
      border-radius: 12px;
      padding: .75rem .85rem;
    }
    .alert{
      border-radius: 12px;
      border: 1px solid rgba(220,53,69,.22);
    }
  </style>
</head>

<body>
<div class="app-wrap">
  <div class="container py-5" style="max-width:560px;">
    <div class="brand">
      <div class="brand-badge">VPN</div>
      <div>
        <div class="fw-semibold" style="line-height:1.15;">Контроль удалённого доступа</div>
        <div class="muted" style="font-size:.92rem;">Вход руководителя СБЕ</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="fw-semibold">Вход</div>
        <div style="font-size:.9rem; opacity:.8;">Введите логин</div>
      </div>

      <div class="card-body">
        {% if error %}
          <div class="alert alert-danger mb-3">
            <div class="fw-semibold">Не удалось выполнить вход</div>
            <div class="small">{{ error }}</div>
          </div>
        {% endif %}

        <form method="post" class="needs-validation" novalidate>
          {% csrf_token %}

          <label class="form-label fw-semibold">Логин</label>
          <div class="input-group mb-3">
            <span class="input-group-text" style="border-radius:12px 0 0 12px; border-color:rgba(17,24,39,.14);">@</span>
            <input class="form-control" name="login" placeholder="например: i.ivanov" required
                   style="border-radius:0 12px 12px 0;">
          </div>

          <button class="btn btn-primary w-100">Войти</button>
        </form>

        <div class="hint mt-3">
          <div class="fw-semibold mb-1">Как это работает</div>
          <div class="muted">
            ПИН-код придёт уведомлением в Битрикс24
          </div>
        </div>

        <div class="mt-3 muted" style="font-size:.85rem;">
          Если ПИН не пришёл — обратитесь к администратору
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (() => {
    document.querySelectorAll('.needs-validation').forEach(form => {
      form.addEventListener('submit', e => {
        if (!form.checkValidity()) {
          e.preventDefault();
          e.stopPropagation();
        }
        form.classList.add('was-validated');
      }, false);
    });
  })();
</script>
</body>
</html>
