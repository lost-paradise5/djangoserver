<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VPN — вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width:520px;">
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="mb-3">Вход руководителя</h4>

      {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <label class="form-label">Логин (AD)</label>
        <input class="form-control" name="login" placeholder="например: i_ivanov" required>
        <button class="btn btn-primary mt-3 w-100">Войти</button>
      </form>

      <div class="text-muted mt-3" style="font-size: 0.9rem;">
        PIN придёт сообщением в Bitrix.
      </div>
    </div>
  </div>
</div>
</body>
</html>
