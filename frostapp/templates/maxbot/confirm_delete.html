{% extends "maxbot/base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ title }}</h1>
</div>

<div class="card" style="max-width: 700px;">
    <p>Подтвердить действие для объекта:</p>
    <p><strong>{{ object_name }}</strong></p>

    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit" class="btn btn-danger">{{ submit_text|default:"Удалить" }}</button>

            {% if back_url_kwargs %}
                <a class="btn btn-secondary" href="{% url back_url_name **back_url_kwargs %}">Отмена</a>
            {% else %}
                <a class="btn btn-secondary" href="{% url back_url_name %}">Отмена</a>
            {% endif %}
        </div>
    </form>
</div>
{% endblock %}
