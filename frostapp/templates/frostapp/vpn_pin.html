<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Контроль УД — PIN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --ui-bg1:#f4f6f9;
      --ui-bg2:#eef2f7;
      --ui-card:#ffffff;
      --ui-border:rgba(17,24,39,.10);
      --ui-shadow: 0 10px 28px rgba(16,24,40,.08);
    }
    body{
      background: radial-gradient(1200px 600px at 20% 0%, var(--ui-bg2), var(--ui-bg1));
      color:#111827;
    }
    .app-wrap{ min-height:100vh; display:flex; align-items:center; }
    .card{
      border:1px solid var(--ui-border);
      box-shadow: var(--ui-shadow);
      border-radius: 16px;
      overflow:hidden;
      background: var(--ui-card);
    }
    .card-header{
      background: linear-gradient(180deg, #0b1220 0%, #101827 100%);
      color:#fff;
      border-bottom:1px solid rgba(255,255,255,.08);
      padding: 1rem 1.25rem;
    }
    .card-body{ padding: 1.25rem; }
    .muted{ color: rgba(17,24,39,.65); }
    .form-control{
      border-radius: 12px;
      padding: .80rem .9rem;
      border:1px solid rgba(17,24,39,.14);
      font-size: 1.15rem;
      letter-spacing: .18em;
      text-align: center;
    }
    .form-control:focus{
      border-color: rgba(13,110,253,.55);
      box-shadow: 0 0 0 .25rem rgba(13,110,253,.12);
    }
    .btn{
      border-radius: 12px;
      padding: .70rem .9rem;
      font-weight: 600;
    }
    .alert{ border-radius: 12px; }
    .chip{
      display:inline-flex; align-items:center; gap:.5rem;
      padding:.35rem .7rem;
      border-radius: 999px;
      border: 1px solid rgba(17,24,39,.12);
      background: #fff;
      color: rgba(17,24,39,.75);
      font-size: .9rem;
    }
    .dot{
      width:8px; height:8px; border-radius:999px;
      background:#20c997;
      box-shadow: 0 0 0 .25rem rgba(32,201,151,.15);
    }
    .autospinner{
      display:none;
      align-items:center;
      gap:.5rem;
      margin-top:.75rem;
      color: rgba(17,24,39,.65);
      font-size:.92rem;
    }
    .autospinner.show{ display:flex; }
    .spinner-border{ width:1rem; height:1rem; }
  </style>
</head>

<body>
<div class="app-wrap">
  <div class="container py-5" style="max-width:560px;">
    <div class="card">
      <div class="card-header">
        <div class="fw-semibold">Подтверждение входа</div>
        <div style="font-size:.9rem; opacity:.8;">ПИН-код проверится автоматически после ввода 4 цифр</div>
      </div>

      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="chip">
            <span class="dot"></span>
            <span>Сессия активна до: <b>{{ expires_at }}</b></span>
          </div>
          <a class="btn btn-outline-secondary btn-sm" href="{% url 'vpn_ui_login' %}" style="border-radius:999px;">
            Начать заново
          </a>
        </div>

        {% if error %}
          <div class="alert alert-danger mb-3">
            <div class="fw-semibold">Ошибка</div>
            <div class="small">{{ error }}</div>
          </div>
        {% endif %}

        <form id="pinForm" method="post" action="?sid={{ sid }}" class="needs-validation" novalidate>
          {% csrf_token %}

          <label class="form-label fw-semibold">ПИН-код (4 цифры)</label>
          <input id="pinInput"
                 class="form-control"
                 name="pin"
                 inputmode="numeric"
                 pattern="\d{4}"
                 maxlength="4"
                 required
                 autocomplete="one-time-code">

          <div id="autoSpinner" class="autospinner">
            <span class="spinner-border" role="status" aria-hidden="true"></span>
            <span>Проверяем ПИН-код…</span>
          </div>

          <button id="submitBtn" class="btn btn-primary mt-3 w-100 d-none" type="submit">Подтвердить</button>

          <div class="mt-3 muted" style="font-size:.9rem;">
            Если ПИН-код не пришёл — проверьте уведомления Битрикс24 и повторите вход
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  const form = document.getElementById("pinForm");
  const input = document.getElementById("pinInput");
  const spinner = document.getElementById("autoSpinner");

  let submitting = false;

  function sanitize() {
    input.value = (input.value || "").replace(/\D+/g, "").slice(0, 4);
  }

  function trySubmitIfReady() {
    if (submitting) return;
    if ((input.value || "").length !== 4) return;

    if (!form.checkValidity()) {
      form.classList.add("was-validated");
      return;
    }

    submitting = true;
    spinner.classList.add("show");
    input.readOnly = true;

    form.submit();
  }

  if (input) {
    input.focus();

    input.addEventListener("input", () => {
      sanitize();
      trySubmitIfReady();
    });

    input.addEventListener("paste", () => {
      setTimeout(() => {
        sanitize();
        trySubmitIfReady();
      }, 0);
    });
  }

  (() => {
    document.querySelectorAll('.needs-validation').forEach(f => {
      f.addEventListener('submit', e => {
        if (!f.checkValidity()) {
          e.preventDefault();
          e.stopPropagation();
        }
        f.classList.add('was-validated');
      }, false);
    });
  })();
</script>

</body>
</html>
