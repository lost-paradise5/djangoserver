{% extends "maxbot/base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ title }}</h1>
</div>

<div class="card" style="max-width: 700px;">
    <p>Подтвердить действие для объекта:</p>
    <p><strong>{{ object_name }}</strong></p>

    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit" class="btn btn-danger">{{ submit_text|default:"Удалить" }}</button>
            <a class="btn btn-secondary" href="{{ back_url }}">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
