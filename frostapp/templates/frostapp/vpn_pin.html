<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Контроль УД-вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width:520px;">
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="mb-2">Введите ПИН</h4>
      <div class="text-muted mb-3">Сессия активна до: <b>{{ expires_at }}</b></div>

      {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
      {% endif %}

      <form method="post" action="?sid={{ sid }}">
        {% csrf_token %}
        <label class="form-label">ПИН (4 цифры)</label>
        <input class="form-control" name="pin" inputmode="numeric" pattern="\d{4}" maxlength="4" required>
        <button class="btn btn-primary mt-3 w-100">Подтвердить</button>
      </form>

      <a class="btn btn-link mt-3" href="{% url 'vpn_ui_login' %}">Начать заново</a>
    </div>
  </div>
</div>
</body>
</html>
