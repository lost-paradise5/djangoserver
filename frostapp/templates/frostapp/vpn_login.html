<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Контроль УД</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --ui-bg:#f5f7fb;
      --ui-card:#ffffff;
      --ui-border:rgba(17,24,39,.10);
      --ui-shadow: 0 10px 28px rgba(16,24,40,.08);
    }
    body{
      background: var(--ui-bg);
      color:#111827;
    }
    .card{
      border:1px solid var(--ui-border);
      box-shadow: var(--ui-shadow);
      border-radius: 14px;
      background: var(--ui-card);
    }
    .form-control{
      border-radius: 12px;
      padding: .75rem .9rem;
      border:1px solid rgba(17,24,39,.14);
    }
    .form-control:focus{
      border-color: rgba(13,110,253,.55);
      box-shadow: 0 0 0 .25rem rgba(13,110,253,.12);
    }
    .btn{
      border-radius: 12px;
      padding: .70rem .9rem;
      font-weight: 600;
    }
    .alert{ border-radius: 12px; }
    .muted{ color: rgba(17,24,39,.65); }
  </style>
</head>

<body class="bg-light">
<div class="container py-5" style="max-width:520px;">
  <div class="card">
    <div class="card-body p-4">

      <h4 class="mb-2">Вход руководителя СБЕ</h4>

      {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
      {% endif %}

      <form method="post" novalidate>
        {% csrf_token %}

        <label class="form-label">Логин</label>
        <input class="form-control"
               name="login"
               placeholder="например: i.ivanov"
               required>

        <button class="btn btn-primary mt-3 w-100">Войти</button>
      </form>

      <div class="muted mt-3" style="font-size: 0.9rem;">
        ПИН-код придёт уведомлением в Битрикс24
      </div>

    </div>
  </div>
</div>
</body>
</html>
